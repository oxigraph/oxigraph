[package]
name = "incroxigraph-js"
version = "0.0.1"
authors = ["Incroxigraph contributors", "Oxigraph contributors"]
license.workspace = true
readme = "README.md"
keywords = ["RDF", "N-Triples", "Turtle", "XML", "SPARQL"]
repository = "https://github.com/maartyman/incroxigraph"
description = "Self-contained JavaScript and WebAssembly bindings for Incroxigraph with incremental SPARQL queries"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "incroxigraph_js"
doc = false

[features]
default = ["geosparql", "rdf-12"]
geosparql = ["oxigraph/geosparql"]
rdf-12 = ["oxigraph/rdf-12"]

[dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
oxigraph = { workspace = true, features = ["js"] }
oxrdfio = { workspace = true, features = ["async-tokio"] }
tokio.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
