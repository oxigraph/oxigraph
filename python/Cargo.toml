[package]
name = "pyincroxigraph"
version = "0.0.1"
authors = ["Incroxigraph contributors", "Oxigraph contributors"]
license.workspace = true
readme = "README.md"
keywords = ["RDF", "SPARQL", "graph-database", "database"]
description = "Self-contained Python bindings for Incroxigraph, an incremental RDF and SPARQL database"
repository = "https://github.com/maartyman/incroxigraph"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "pyincroxigraph"
doctest = false
doc = false

[features]
default = ["geosparql", "rdf-12"]
abi3 = ["pyo3/abi3-py39"]
abi3t = ["pyo3/abi3t-py315"]
rocksdb-pkg-config = ["oxigraph/rocksdb-pkg-config"]
geosparql = ["oxigraph/geosparql"]
rdf-12 = ["oxigraph/rdf-12"]

[dependencies]
pyo3.workspace = true
oxstr.workspace = true

[target.'cfg(any(target_family = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
oxigraph = { workspace = true, default-features = true, features = [
  "http-client-native-tls",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
oxigraph = { workspace = true, default-features = true }

[target.'cfg(not(any(target_family = "windows", target_os = "macos", target_os = "ios", target_family = "wasm")))'.dependencies]
oxigraph = { workspace = true, default-features = true, features = [
  "http-client-rustls-native",
] }

[lints]
workspace = true
