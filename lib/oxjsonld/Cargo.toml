[package]
name = "incroxigraph-oxjsonld"
version = "0.0.1"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["JSON-LD", "RDF"]
repository = "https://github.com/maartyman/incroxigraph"
description = "Parser and serializer for the JSON-LD format"
documentation = "https://docs.rs/incroxigraph-oxjsonld"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "oxjsonld"

[features]
default = []
async-tokio = ["dep:tokio", "json-event-parser/async-tokio"]
rdf-12 = ["oxrdf/rdf-12"]

[dependencies]
json-event-parser.workspace = true
oxiri.workspace = true
oxrdf.workspace = true
oxstr.workspace = true
ryu-js.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
