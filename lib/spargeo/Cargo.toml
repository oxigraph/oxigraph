[package]
name = "incroxigraph-spargeo"
version = "0.0.1"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["GeoSPARQL"]
repository = "https://github.com/maartyman/incroxigraph"
documentation = "https://docs.rs/incroxigraph-spargeo"
description = "GeoSPARQL functions"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "spargeo"

[features]
default = []

[dependencies]
geo.workspace = true
geojson.workspace = true
oxrdf.workspace = true
oxstr.workspace = true
wkt.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
