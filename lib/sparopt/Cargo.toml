[package]
name = "incroxigraph-sparopt"
version = "0.0.1"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["SPARQL"]
repository = "https://github.com/maartyman/incroxigraph"
documentation = "https://docs.rs/incroxigraph-sparopt"
description = "SPARQL optimizer"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sparopt"

[features]
default = []
sparql-12 = ["spargebra/sparql-12"]
sep-0002 = ["spargebra/sep-0002"]
sep-0006 = ["spargebra/sep-0006"]

[dependencies]
oxrdf.workspace = true
oxstr.workspace = true
rand.workspace = true
spargebra.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
