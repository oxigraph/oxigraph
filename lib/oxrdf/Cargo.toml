[package]
name = "oxrdf"
version = "0.4.0-dev"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["RDF"]
repository = "https://github.com/oxigraph/oxigraph/tree/main/lib/oxrdf"
description = "Basic data structures related to RDF"
documentation = "https://docs.rs/oxrdf"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = [
  "dep:rand",
  "oxilangtag/std",
  "oxiri/std",
  "oxsdatatypes?/std",
  "oxstr/std",
  "serde?/std",
  "thiserror/std",
]
rdf-12 = []
rdfc-10 = ["dep:hex", "dep:sha2"]
serde = ["dep:serde", "oxstr/serde"]

[dependencies]
hex = { workspace = true, optional = true, default-features = false, features = ["alloc"] }
hashbrown.workspace = true
oxilangtag = { workspace = true, default-features = false }
oxiri = { workspace = true, default-features = false }
oxsdatatypes = { workspace = true, optional = true, default-features = false }
oxstr = { workspace = true, default-features = false }
sha2 = { workspace = true, optional = true, default-features = false }
rand = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive", "alloc"], optional = true, default-features = false }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
