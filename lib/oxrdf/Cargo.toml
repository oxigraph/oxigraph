[package]
name = "incroxigraph-oxrdf"
version = "0.0.1"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["RDF"]
repository = "https://github.com/maartyman/incroxigraph"
description = "Basic data structures related to RDF"
documentation = "https://docs.rs/incroxigraph-oxrdf"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "oxrdf"

[features]
default = []
rdf-12 = []
rdfc-10 = ["dep:hex", "dep:sha2"]
serde = ["dep:serde", "oxstr/serde"]

[dependencies]
hex = { workspace = true, optional = true }
oxilangtag.workspace = true
oxiri.workspace = true
oxsdatatypes = { workspace = true, optional = true }
oxstr.workspace = true
sha2 = { workspace = true, optional = true }
rand.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
